# Uso: copia .env.example a .env, pon contraseñas y ejecuta:  docker compose up -d
# Sitio: http://localhost:8080   ·   Base de datos: localhost:3307
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: rivera
      MARIADB_USER: ${DB_USER:-riverauser}
      MARIADB_PASSWORD: ${DB_PASS:?Falta DB_PASS en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Falta DB_ROOT_PASS en .env}
    volumes:
      - datos_mariadb:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro   # crea tablas y textos la primera vez
    ports:
      - "3307:3306"

  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_NAME: rivera
      DB_USER: ${DB_USER:-riverauser}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"

volumes:
  datos_mariadb:
